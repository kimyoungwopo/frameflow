name: Feature request
description: Suggest a focused improvement to the public project.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private provider results, credentials, account details, or personal assets.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
