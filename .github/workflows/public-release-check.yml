name: public-release-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run setup
      - run: npm test
      - run: npm run typecheck
      - run: npm run agent:check
      - run: npm run public:check
      - run: npm run build
